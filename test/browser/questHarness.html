<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>MW2 isolated Quest tests</title>
<h1>Quest renderer tests</h1>
<p>Development fixture. Uses its own mission, never player saves. These are offscreen image checks, not headset FPS measurements.</p>
<pre id="result">Ready</pre>
<script type="module">
  import { runWorldBatchComparison } from './worldBatch.ts';
  import { runSceneWorkerProbe } from './sceneWorkerProbe.ts';
  import { runContinuousWorkerProbe } from './continuousWorkerProbe.ts';
  window.runQuestContinuousWorkerTests = runContinuousWorkerProbe;
  window.runQuestResourceSnapshotTests = async () => {
    const world = await runWorldBatchComparison('resourceSnapshot');
    const worker = await runSceneWorkerProbe(true, true);
    return { kind: 'resource-snapshot-drop-regression', xr: false,
      userAgent: navigator.userAgent, world, worker,
      note: 'Fixed resource basis plus independent frames; skipped texture/geometry updates and fresh head views. Not production XR performance.' };
  };
  window.runQuestHeadSnapshotTests = async () => {
    const world = await runWorldBatchComparison('headSnapshot');
    const worker = await runSceneWorkerProbe(true);
    return { kind: 'unculled-snapshot-head-turn-regression', xr: false,
      userAgent: navigator.userAgent, world, worker, snapshots: 3,
      note: 'One unculled snapshot per simulation phase; all viewpoints consume it without producer updates.' };
  };
  window.runQuestSnapshotTests = async () => {
    const status = document.querySelector('#result');
    status.textContent = 'Comparing copied scene images…';
    const world = await runWorldBatchComparison('snapshot');
    status.textContent = 'Rendering a real worker scene during a producer stall…';
    const worker = await runSceneWorkerProbe();
    const report = { kind: 'snapshot-image-and-worker-regression', xr: false,
      userAgent: navigator.userAgent, world, worker };
    status.textContent = JSON.stringify(report, null, 2);
    return report;
  };
  import { runHudCropComparison } from './hudCrop.ts';
  import { runLightingBenchmark } from './lightingBenchmark.ts';
  import { runResourceLifetimeCheck } from './resourceLifetime.ts';
  import { loadHudKernel } from '../../src/render/wasm/hudKernel.ts';
  import { runTargetLifetimeCheck } from './targetLifetime.ts';
  window.runQuestTests = async () => {
    const status = document.querySelector('#result');
    status.textContent = 'Running world comparison…';
    const world = await runWorldBatchComparison();
    status.textContent = 'Comparing Wasm polygon images…';
    const wasmWorld = await runWorldBatchComparison('wasm');
    status.textContent = 'Comparing scrounge batch images and submission costs…';
    const scrounge = await runWorldBatchComparison('scrounge');
    status.textContent = 'Running HUD comparison…';
    const hud = runHudCropComparison();
    await loadHudKernel();
    const wasmHud = runHudCropComparison(undefined, 'wasm');
    status.textContent = 'Running lighting CPU comparison…';
    const lighting = await runLightingBenchmark();
    status.textContent = 'Checking mission resource cleanup…';
    const resources = await runResourceLifetimeCheck();
    const scroungeResources = await runResourceLifetimeCheck(true, true);
    status.textContent = 'Checking target monitor resource lifetime…';
    const targetResources = await runTargetLifetimeCheck();
    const result = {
      kind: 'offscreen-image-regression', xr: false,
      userAgent: navigator.userAgent, visibility: document.visibilityState,
      world, wasmWorld, scrounge, hud, wasmHud, lighting, resources, scroungeResources, targetResources,
      note: 'Executed on device; no XR/compositor FPS or thermal-performance claim.'
    };
    status.textContent = JSON.stringify(result, null, 2);
    return result;
  };
</script>
</html>
